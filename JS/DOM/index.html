 <!-- ==============================Project 2========================== -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form to Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <button id="showFormBtn">Add User</button>

    <!-- Form -->
    <form class="user-form">
        <input type="text" id="name" placeholder="Enter Name" required>
        <input type="text" id="image" placeholder="Enter Image URL" required>
        <input type="text" id="bio" placeholder="Enter Bio" required>
        <div>
            <button type="submit">Add</button>
            <button type="button" id="reset">Reset</button>
        </div>
    </form>

    <!-- Cards -->
    <div class="cards-collection"></div>

</div>

<script src="DomJS.js"></script>
</body>
</html>
